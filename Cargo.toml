[package]
name = "authelia-pam"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
# TLS through the system's OpenSSL (native-tls), linked dynamically, with the system's certificate authorities: the
# binary carries no TLS of its own. For glibc systems.
openssl = ["ureq/native-tls-no-default"]
# TLS through rustls (ring), statically linked, with the system's certificate authorities (platform verifier). For
# static musl builds that must run anywhere.
rustls = ["ureq/rustls-no-provider", "ureq/platform-verifier", "dep:rustls"]

[dependencies]
ureq = { version = "3.5.1", default-features = false }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring"] }
pico-args = "0.5.0"
serde_json = "1.0.154"

[profile.release]
opt-level = 'z'
strip = true
lto = true
codegen-units = 1
panic = "abort"
